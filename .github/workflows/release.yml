name: Release

# Push a tag like beta-v0.2.0 (during the beta) or v1.0.0 — or publish a
# release with such a tag in the GitHub UI — to build installers for every
# platform, attach them (plus auto-update metadata) to the release, and push
# server images to GHCR. The app's version is the tag without its prefix.
# Keep beta releases as normal releases, not pre-releases: the apps' updater,
# the website and the install scripts all look at the latest release.
on:
  push:
    tags: ['v*', 'beta-v*']
  release:
    types: [published]

# Read-only by default; each job asks only for what it writes.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

# Publishing a release in the UI fires both a tag push and a release event;
# the push run skips itself (see prepare), so each tag builds once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          n='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^(beta-)?v$n\.$n\.$n$ ]]; then
            echo "::error::Release tags look like beta-v1.2.3 or v1.2.3, not $TAG"
            exit 1
          fi
          version="${TAG#*v}"
          title="Crocodile $version"
          if [[ "$TAG" == beta-* ]]; then title="$title beta"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Published in the UI: its own 'release' run does the work.
            if [ "$EVENT" = push ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          else
            # Plain tag push: create a draft that every platform uploads into.
            notes="docs/releases/${TAG}.md"
            [ -f "$notes" ] || notes=docs/releases/default.md
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: prepare
    permissions:
      contents: write # upload installers to the release
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        working-directory: apps/desktop
        shell: bash
        # beta-v1.2.3 and v1.2.3 both give 1.2.3; the prefix tells
        # electron-builder which release to upload into.
        run: |
          npm version --no-git-tag-version --allow-same-version "${TAG#*v}"
          echo "CROC_TAG_PREFIX=${TAG%%v*}v" >> "$GITHUB_ENV"
      - name: Build and publish
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload into the release even if it was published a while ago.
          EP_GH_IGNORE_TIME: 'true'
          # Directory services baked into the app (comma-separated URLs).
          CROC_DIRECTORIES: ${{ vars.CROC_DIRECTORIES }}
          # Code signing is optional; without these secrets builds are unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing secrets arrive as empty strings, which electron-builder
          # would take as a certificate path. Unset them instead.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          node scripts/build.mjs
          npx electron-builder --config electron-builder.config.cjs --publish always

  # The command line tool as a standalone program per system and processor
  # (no Node.js needed), attached to the release for scripts/install.sh --cli.
  cli:
    name: Command line tool (${{ matrix.os }})
    needs: prepare
    permissions:
      contents: write # upload the programs to the release
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CROC_CLI_VERSION="${TAG#*v}"
          node apps/cli/scripts/build.mjs
          node apps/cli/scripts/sea.mjs
          cd apps/cli/dist
          exe=$(ls crocodile-cli-*)
          "./$exe" --version
          base="${exe%.exe}"
          if [[ "$exe" == *.exe ]]; then
            7z a "$base.zip" "$exe" > /dev/null
            asset="$base.zip"
          else
            tar -czf "$base.tar.gz" "$exe"
            asset="$base.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber

  # npm install -g crocodile-cli. Needs an npm access token in the NPM_TOKEN
  # secret; without one this step is skipped.
  npm:
    name: npm package
    needs: prepare
    permissions:
      contents: read
      id-token: write # npm provenance: the package says which build made it
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret, so the npm package was not published."
            exit 0
          fi
          version="${TAG#*v}"
          npm version --no-git-tag-version --allow-same-version "$version"
          CROC_CLI_VERSION="$version" node scripts/build.mjs
          cp ../../LICENSE ../../NOTICE .
          pnpm publish --access public --no-git-checks --provenance

  # Make a draft (tag-push) release public once every platform is in; keep
  # whatever title, notes and pre-release choice a UI-published release has.
  publish:
    name: Publish release
    needs: [prepare, installers]
    permissions:
      contents: write # publish the release
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
            args+=(--draft=false)
          fi
          if [ -z "$(gh release view "$TAG" --json body -q .body | tr -d '[:space:]')" ]; then
            notes="docs/releases/${TAG}.md"
            [ -f "$notes" ] || notes=docs/releases/default.md
            args+=(--notes-file "$notes")
          fi
          if [ ${#args[@]} -gt 0 ]; then gh release edit "$TAG" "${args[@]}"; fi

  images:
    name: Server images
    needs: prepare
    permissions:
      contents: read
      packages: write # push to ghcr.io
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        # beta-v1.2.3 and v1.2.3 both give 1.2.3.
        run: echo "version=${TAG#*v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/coordinator/Dockerfile
          build-args: CROC_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/directory/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-directory:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-directory:latest
