# The main Crocodile server: server directory and a first coordination
# server. HTTPS comes from the reverse proxy already running on the
# machine; see README.md for what it must route.
#
#   cd deploy/main
#   cp .env.example .env    # set CROC_DOMAIN
#   docker compose up -d --build
#
# Both HTTP services listen on 127.0.0.1 only, so they are reachable just
# through the proxy. Firewall: TCP 80 and 443 (proxy), UDP 7443 (STUN, relay),
# UDP 7444 (STUN) and UDP 49160-49259 (relayed traffic).
services:
  directory:
    build:
      context: ../..
      dockerfile: apps/directory/Dockerfile
    image: ghcr.io/pwalda/crocodile-directory:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:7400:7400'
    environment:
      # Behind the proxy (and on 127.0.0.1 only): take client addresses from
      # X-Forwarded-For, so each server gets its own registration limit.
      CROC_DIR_TRUST_PROXY: '1'
    volumes:
      - directory-data:/data

  coordinator:
    build:
      context: ../..
      dockerfile: packages/coordinator/Dockerfile
    image: ghcr.io/pwalda/crocodile-coordinator:latest
    restart: unless-stopped
    # The host's network, not published ports: the relay needs a UDP port per
    # relayed connection (CROC_RELAY_PORTS), and publishing a hundred ports
    # would start a proxy process for each. It listens on:
    # - TCP 7443 on 127.0.0.1 only (CROC_HOST): WebSocket traffic comes through
    #   the proxy, and the server trusts X-Forwarded-For (below), so a public
    #   TCP port would let clients fake their address and dodge the per-IP limit.
    #   A proxy running in a container can't reach the host's 127.0.0.1: set
    #   CROC_COORD_HOST in .env to its Docker network's gateway (README.md);
    # - UDP 7443 (STUN and the opt-in relay) and 7444 (second STUN port, lets
    #   apps detect their NAT type without third-party servers);
    # - UDP 49160-49259 (relayed traffic, one port per relayed connection).
    network_mode: host
    environment:
      CROC_HOST: ${CROC_COORD_HOST:-127.0.0.1}
      CROC_NAME: ${CROC_COORD_NAME:-Crocodile main}
      CROC_PUBLIC_URL: https://coord.${CROC_DOMAIN:?set CROC_DOMAIN in .env}
      CROC_DIRECTORY: https://${CROC_DOMAIN}
      CROC_REGION: ${CROC_REGION:-}
      CROC_RELAY: ${CROC_RELAY:-on}
      CROC_RELAY_MAX_USERS: ${CROC_RELAY_MAX_USERS:-25}
      CROC_RELAY_IP: ${CROC_RELAY_IP:-}
      CROC_RELAY_PORTS: ${CROC_RELAY_PORTS:-49160-49259}
      CROC_MAILBOX: ${CROC_MAILBOX:-on}
      CROC_MAILBOX_DAYS: ${CROC_MAILBOX_DAYS:-3}
      # Shown in the apps as how to reach whoever runs this server.
      CROC_CONTACT: https://${CROC_DOMAIN}/privacy/
      # Behind the proxy: take client addresses from X-Forwarded-For.
      CROC_TRUST_PROXY: '1'
      # Keep a copy of every record, so the network never depends on a few
      # home computers for its data (docs/MESH.md).
      CROC_STORE_ALL: '1'
    volumes:
      - coordinator-data:/data
    depends_on: [directory]

volumes:
  directory-data:
  coordinator-data:
