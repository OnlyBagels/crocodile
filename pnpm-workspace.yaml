packages:
  - packages/*
  - apps/*
  - tests
onlyBuiltDependencies:
  - electron
  - esbuild
# Security fixes in transitive dependencies. Drop each once the packages that
# pull it in require a fixed version. Only fast-uri ships (in the coordinator
# and directory images, via fastify); the rest is build, test and lint tooling.
overrides:
  # GHSA-ch52-4w7c-c8xp, via electron-builder > @electron/get > got
  http-cache-semantics@<4.3.0: ^4.3.0
  # GHSA-68fv-2mgg-jv7q, via @vitest/coverage-v8 > magicast
  source-map-js@<1.2.2: ^1.2.2
  # GHSA-333x-w4r6-6crp and others, via fastify > @fastify/ajv-compiler > ajv
  # and fastify > fast-json-stringify
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=4.0.0 <4.2.3: ^4.2.3
  # undici DoS advisories, via @electron/get (7.x) and node-gyp (6.x)
  undici@>=6.0.0 <6.29.1: ^6.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # GHSA-mrhx-c7xc-m3w5, via eslint-plugin-react-hooks
  zod@<4.6.6: ^4.6.6
